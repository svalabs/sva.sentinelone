---
platforms:
  - name: ubuntu-2604
    lima_template: ubuntu-26.04
    memory: 2
    cpus: 2

  - name: fedora-44
    lima_template: fedora-44
    memory: 2
    cpus: 2

driver:
  options:
    managed: true

ansible:
  playbooks:
    create: ../lima/create.yml
    destroy: ../lima/destroy.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
    cleanup: cleanup.yml

provisioner:
  inventory:
    host_vars:
      windows-11-25h2:
        ansible_become: false
        ansible_remote_tmp: '%TEMP%'
        ansible_winrm_scheme: http
        ansible_winrm_operation_timeout_sec: 60
        ansible_winrm_read_timeout_sec: 70
