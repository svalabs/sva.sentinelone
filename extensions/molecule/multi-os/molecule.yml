---
scenario:
  name: multi-os

platforms:
  - name: ubuntu-2204
    lima_template: ubuntu-22.04
    memory: 2
    cpus: 2

  - name: ubuntu-2404
    lima_template: ubuntu-24.04
    memory: 2
    cpus: 2

  - name: ubuntu-2604
    lima_template: ubuntu-26.04
    memory: 2
    cpus: 2

  - name: rocky-9
    lima_template: rocky-9
    memory: 2
    cpus: 2

  - name: rocky-10
    lima_template: rocky-10
    memory: 2
    cpus: 2

  - name: opensuse-leap-160
    lima_template: opensuse-leap-16
    memory: 2
    cpus: 2

  - name: debian-12
    lima_template: debian-12
    memory: 2
    cpus: 2

  - name: debian-13
    lima_template: debian-13
    memory: 2
    cpus: 2

  - name: fedora-43
    lima_template: fedora-43
    memory: 2
    cpus: 2

  - name: fedora-44
    lima_template: fedora-44
    memory: 2
    cpus: 2

driver:
  options:
    managed: true

ansible:
  playbooks:
    create: ../lima/create.yml
    destroy: ../lima/destroy.yml
    prepare: ../default/prepare.yml
    converge: ../default/converge.yml
    verify: ../default/verify.yml
    cleanup: ../default/cleanup.yml

provisioner:
  inventory:
    host_vars:
      rocky-8:
        ansible_python_interpreter: "/usr/bin/python3.12"
      windows-11-25h2:
        ansible_become: false
        ansible_remote_tmp: '%TEMP%'
        ansible_winrm_scheme: http
        ansible_winrm_operation_timeout_sec: 60
        ansible_winrm_read_timeout_sec: 70
