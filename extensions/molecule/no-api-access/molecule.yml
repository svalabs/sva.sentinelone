---
scenario:
  name: no-api-access

platforms:
  - name: ubuntu-2204
    lima_template: ubuntu-22.04
    memory: 2
    cpus: 2

  - name: ubuntu-2404
    lima_template: ubuntu-24.04
    memory: 2
    cpus: 2

  - name: rocky-8
    lima_template: rocky-8
    arch: x86_64
    memory: 2
    cpus: 2

  - name: rocky-9
    lima_template: rocky-9
    memory: 2
    cpus: 2

  - name: rocky-10
    lima_template: rocky-10
    memory: 2
    cpus: 2

  - name: opensuse-leap-160
    lima_template: opensuse-leap-16
    memory: 2
    cpus: 2

  - name: debian-12
    lima_template: debian-12
    memory: 2
    cpus: 2

  - name: debian-13
    lima_template: debian-13
    memory: 2
    cpus: 2

  - name: fedora-42
    lima_template: fedora-42
    memory: 2
    cpus: 2

  - name: fedora-43
    lima_template: fedora-43
    memory: 2
    cpus: 2

driver:
  options:
    managed: true

ansible:
  env:
    ANSIBLE_TIMEOUT: "300"
  playbooks:
    create: ../lima/create.yml
    destroy: ../lima/destroy.yml
    prepare: ../default/prepare.yml
    converge: converge.yml
    verify: verify.yml
    cleanup: ../default/cleanup.yml

provisioner:
  inventory:
    host_vars:
      rocky-8:
        ansible_python_interpreter: "/usr/bin/python3.12"
