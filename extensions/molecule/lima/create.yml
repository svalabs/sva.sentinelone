---
- name: Create Lima test instances
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create test instances with Lima
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/../lima/manage.py"
          - create
      changed_when: true
