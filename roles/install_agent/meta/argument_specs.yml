---
argument_specs:
  # roles/install_agent/tasks/main.yml entry point
  main:
    short_description: "Entrypoint for install_agent role"
    description:
      - "This is the main entrypoint for the C(install_agent) role."
      - "The entrypoint contains all os independent tasks and prepares the environment
        for the os specific tasks."
    author:
      - Marco Wester
    options:
      win_use_exe:
        type: "bool"
        required: false
        default: false
        description:
          - "Windows only: Controls the Windows agent package format."
          - "B(false:) Downloads .msi installer file"
          - "B(true:) Downloads .exe installer file"
        choices:
          - true
          - false

      win_allow_reboot:
        type: "bool"
        required: false
        default: true
        description:
          - "Windows only: Endpoint needs to be rebooted to SentinelOne work properly."
          - "Set to B(false) to disable automatic reboot"
        choices:
          - true
          - false

      agent_version:
        type: "str"
        required: false
        default: "latest"
        description:
          - "The agent version string. B(default) is to install 'latest' version."
          - "B(latest:) Install latest GA version."
          - "B(latest_ea:) Install latest EA version."
          - "B(custom): Install custom agent version. If set to custom argument 'custom_version' is required."
        choices:
          - "latest"
          - "latest_ea"
          - "custom"

      hide_sensitive:
        type: "bool"
        required: false
        default: true
        description:
          - "Hide sensitive information like API keys in module output."
          - "Only change to false for debugging purposes."
        choices:
          - true
          - false

      lx_force_new_token:
        type: "bool"
        required: false
        default: false
        description: "Linux only: Set the management token on the linux agent even if it is already registered."
        choices:
          - true
          - false

      check_console_retries:
        type: "int"
        required: false
        default: 3
        description: "How many times the ansible role tries to find the agent in the management console after installation"

      check_console_retry_delay:
        type: "int"
        required: false
        default: 20
        description: "The delay in s between two attempts to find the agent in the management console after installation"

      custom_version:
        type: "str"
        required: false
        description:
          - "Required when 'agent_version' is set to B(custom)."
          - "Explicit version of the agent to be installed."

      console_url:
        type: "str"
        required: false
        description:
          - "The SentinelOne management console URL. E.g. https://my-s1-console.net."
          - "Required if registration_token and custom_client_url both are not provided"

      api_token:
        type: "str"
        required: false
        description:
          - "The API token to authenticate at the management console."
          - "Required if registration_token and custom_client_url both are not provided"

      site:
        type: "str"
        required: false
        description:
          - "The name of the site where the new endpoint should join."
          - "Required if registration_token and custom_client_url both are not provided"

      group:
        type: "str"
        required: false
        description: "Optional: The name of the group where the new endpoint should join."

      gpg_key:
        type: "str"
        required: false
        description:
          - "The path to the gpg key to verify the agent package integrity on rpm based systems."

      registration_token:
        type: "str"
        required: false
        description:
          - "Optional registration token. Usefull if no API access is available and the agent should be registered manually."
          - "'console_url', 'api_token' and 'site' will be ignored if registration_token and custom_client_url are both set"

      custom_client_url:
        type: "str"
        required: false
        description:
          - "Optional URL to a package source to download the SentinelOne client package. If not set, SentinelOne client will be downloaded by via SentinelOne
            Console."
          - "'console_url', 'api_token' and 'site' will be ignored if registration_token and custom_client_url are both set"
